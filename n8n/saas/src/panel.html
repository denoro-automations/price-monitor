<!doctype html>
<html lang="es" class="js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#fcfcfa">
<title>Tu panel · Denoro Automations</title>
<link rel="icon" href="https://denoroautomations.com/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>/*CSS*/</style>
</head>
<body class="app">
<a class="skip" href="#main">Ir al contenido</a>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="https://denoroautomations.com/" target="_blank" rel="noopener" aria-label="Denoro Automations (abre la web en otra pestaña)"><i aria-hidden="true">D</i>Denoro <span>Automations</span></a>
    <div class="p-who"><span class="hint" id="who"></span><a class="btn ghost sm" href="mailto:manelfernandezp1@gmail.com?subject=Duda%20sobre%20mi%20panel">Escríbeme</a></div>
  </div>
</header>

<main id="main"><div class="wrap" id="app"><div class="p-center"><p class="hint" role="status"><span class="p-spin" aria-hidden="true"></span>&nbsp; Cargando tu panel…</p></div></div></main>

<footer><div class="wrap"><span>© Denoro Automations · Este es tu panel privado: no compartas el enlace.</span><a href="https://denoroautomations.com/legal.html" target="_blank" rel="noopener">Aviso legal y privacidad</a></div></footer>
<div class="p-toast" id="toast" role="status" aria-live="polite"></div>

<script>
/*AUTOS*/
(() => {
  const API = location.pathname.replace(/\/panel\/?$/, '/api');
  const BOT = '__BOT_USERNAME__';
  const token = new URLSearchParams(location.search).get('t') || '';
  const TZ_LOCAL = Intl.DateTimeFormat().resolvedOptions().timeZone;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const TYPES = { shopify_tienda: 'Tienda Shopify', woo_tienda: 'Tienda WooCommerce', shopify_producto: 'Producto · Shopify', woo_producto: 'Producto · WooCommerce', producto: 'Producto' };
  const money = (v, cur) => { if (v === null || v === undefined || v === '') return '—'; try { return new Intl.NumberFormat('es-ES', cur ? { style: 'currency', currency: cur } : { minimumFractionDigits: 2 }).format(v); } catch (e) { return `${v} ${cur || ''}`; } };
  const fecha = (iso) => new Date(iso).toLocaleString('es-ES', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Madrid' });
  const ago = (iso) => {
    if (!iso) return 'todavía no';
    const m = Math.round((Date.now() - new Date(iso)) / 60000);
    if (m < 1) return 'hace un momento'; if (m < 60) return `hace ${m} min`;
    const h = Math.round(m / 60); if (h < 24) return `hace ${h} h`;
    const d = Math.round(h / 24); if (d < 7) return `hace ${d} día${d > 1 ? 's' : ''}`;
    return new Date(iso).toLocaleDateString('es-ES', { day: 'numeric', month: 'short' });
  };
  const horasTxt = (h) => (h < 1 ? `${Math.round(h * 60)} minutos` : h === 1 ? '1 hora' : `${h} horas`);
  const ICON_BACK = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  let S = null;            // estado del cliente
  let tab = '';
  let pending = null;      // enlace detectado en el monitor, pendiente de confirmar
  let dirty = false;       // hay cambios sin guardar en la pestaña abierta
  let tipN = 0;
  let medirTabs = () => {};
  window.addEventListener('resize', () => medirTabs());

  function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 3800); }
  const msg = (el, text, kind = 'err') => { if (typeof el === 'string') el = $(el); if (el) el.innerHTML = text ? `<p class="msg ${kind}" role="${kind === 'err' ? 'alert' : 'status'}">${esc(text)}</p>` : ''; };
  async function api(accion, data = {}) {
    let res;
    try { res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token, accion, ...data }) }); }
    catch (e) { return { ok: false, error: 'No hay conexión con el servidor. Inténtalo en un momento.' }; }
    try { return await res.json(); } catch (e) { return { ok: false, error: `El servidor no ha respondido bien (error ${res.status}). Inténtalo en un momento.` }; }
  }
  async function busy(btn, text, fn) {
    const html = btn.innerHTML; btn.disabled = true; btn.setAttribute('aria-busy', 'true'); btn.innerHTML = `<span class="p-spin" aria-hidden="true"></span> ${esc(text)}`;
    try { return await fn(); } finally { btn.disabled = false; btn.removeAttribute('aria-busy'); btn.innerHTML = html; }
  }

  // ---------------------------------------------------------------- ayuda «i»
  function tip(clave, label) {
    const a = Array.isArray(clave) ? clave : null;
    const [texto, ej] = a || [];
    if (!texto) return '';
    const id = `tip-${++tipN}`;
    return `<span class="p-tip"><button type="button" class="p-tip-btn" aria-label="Ayuda: ${esc(label)}" aria-expanded="false" aria-describedby="${id}">i</button>` +
      `<span class="p-tip-bubble" role="tooltip" id="${id}">${esc(texto)}${ej ? `<b>Ejemplo</b><span class="ej">${esc(ej)}</span>` : ''}</span></span>`;
  }
  const ayuda = (auto, k) => ayudaDe(auto, k);
  const lbl = (id, texto, ay) => `<div class="p-label"><label for="${id}">${esc(texto)}</label>${tip(ay, texto)}</div>`;
  function cerrarTips(excepto) { document.querySelectorAll('.p-tip.open').forEach((t) => { if (t !== excepto) { t.classList.remove('open'); t.querySelector('.p-tip-btn').setAttribute('aria-expanded', 'false'); } }); }
  document.addEventListener('click', (e) => {
    const b = e.target.closest('.p-tip-btn');
    if (b) { e.preventDefault(); const t = b.parentElement; const abrir = !t.classList.contains('open'); cerrarTips(t); t.classList.toggle('open', abrir); t.classList.remove('closed'); b.setAttribute('aria-expanded', String(abrir)); colocar(t); return; }
    if (!e.target.closest('.p-tip-bubble')) cerrarTips();
  }, true);
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    const abiertos = document.querySelectorAll('.p-tip.open, .p-tip:hover, .p-tip:focus-within');
    abiertos.forEach((t) => t.classList.add('closed')); cerrarTips();
  });
  document.addEventListener('mouseover', (e) => { const t = e.target.closest('.p-tip'); if (t) colocar(t); });
  document.addEventListener('focusin', (e) => { const t = e.target.closest('.p-tip'); if (t) colocar(t); });
  document.addEventListener('mouseout', (e) => { const t = e.target.closest('.p-tip'); if (t && !t.contains(e.relatedTarget)) t.classList.remove('closed'); });
  document.addEventListener('focusout', (e) => { const t = e.target.closest('.p-tip'); if (t && !t.contains(e.relatedTarget)) { t.classList.remove('closed'); } });
  function colocar(t) {   // la burbuja no se sale nunca de la pantalla; la flecha sigue apuntando a la «i»
    const b = t.querySelector('.p-tip-bubble'); if (!b) return;
    const r = t.getBoundingClientRect(); const vw = document.documentElement.clientWidth;
    const w = Math.min(320, vw - 32);
    let left = -8;
    if (r.left + left + w > vw - 16) left = vw - 16 - w - r.left;
    if (r.left + left < 16) left = 16 - r.left;
    b.style.left = `${left}px`; b.style.setProperty('--flecha', `${Math.max(8, r.width / 2 - left - 5)}px`);
  }

  // ---------------------------------------------------------------- estado de cada automatización
  const servicio = (id) => S.servicios.find((s) => s.id === id);
  const enCurso = (e) => e?.en_curso && Date.now() - new Date(e.en_curso).getTime() < EN_CURSO_MS;
  const sinAvisos = () => !S.cliente.email && !S.cliente.telegram_chat_id;
  function estadoAuto(s) {
    if (s.id === 'monitor') {
      const r = s.estado;
      if (!S.vigilancias.length) return { cls: 'info', txt: 'Añade tu primer enlace', dot: '' };
      if (!r) return { cls: 'info', txt: 'Primera revisión pendiente', dot: '' };
      if (r.con_error > 0) return { cls: 'bad', txt: `${r.con_error} enlace${r.con_error > 1 ? 's' : ''} con error`, dot: 'bad' };
      return { cls: 'ok', txt: 'Vigilando', dot: 'ok' };
    }
    const e = s.estado;
    if (enCurso(e)) return { cls: 'run', txt: 'Ejecutándose ahora…', dot: 'run' };
    if (sinAvisos()) return { cls: 'bad', txt: 'Parada: falta dónde avisarte', dot: 'bad' };
    if (!e) return { cls: 'info', txt: 'Sin ejecutar todavía', dot: '' };
    if (e.ok === false) return { cls: 'bad', txt: 'Falló la última vez', dot: 'bad' };
    return { cls: 'ok', txt: e.demo ? 'Funcionando · datos de ejemplo' : 'Funcionando', dot: 'ok' };
  }
  const horaEsp = () => (TZ_LOCAL && TZ_LOCAL !== 'Europe/Madrid' ? ' (hora de España)' : '');
  function cadaTxt(a, aj) {
    if (a.cada.tipo === 'horas') return `Cada ${horasTxt(Number(aj.cada_horas || a.cada.def))}${a.cada.semanal && aj[a.cada.semanal.campo] !== false ? ` · ${a.cada.semanal.texto}${horaEsp()}` : ''}`;
    if (a.cada.tipo === 'semanal') return a.cada.opcional && aj.programado === false ? 'Solo cuando pulses «Ejecutar ahora»' : `${a.cada.texto}${horaEsp()}`;
    return `Cada ${horasTxt(S.ajustes.frecuencia_horas)}`;
  }
  function proxima(a, s) {
    const aj = s.ajustes || {};
    if (sinAvisos()) return 'Cuando pongas dónde avisarte';
    if (enCurso(s.estado)) return 'Ahora mismo';
    if (a.cada.tipo === 'horas') {
      const u = s.estado?.ultima; const h = Number(aj.cada_horas || a.cada.def);
      if (!u) return 'En la próxima media hora';
      const t = new Date(u).getTime() + h * 3600000;
      return t <= Date.now() + 30 * 60000 ? 'En la próxima media hora' : fecha(new Date(t).toISOString());
    }
    if (a.cada.tipo === 'semanal') {
      if (a.cada.opcional && aj.programado === false) return 'Cuando tú la lances';
      return fecha(new Date(ultimaCitaSemanal(Date.now(), a.cada.dia, a.cada.hora) + 7 * 86400000).toISOString());
    }
    return '';
  }
  const origenTxt = (aj) => {
    const vals = [aj.fuente, aj.destino].filter(Boolean);
    if (!vals.length) return '';
    return vals.every((v) => v === 'demo') ? 'Datos de ejemplo' : vals.includes('demo') ? 'Mezcla de ejemplo y reales' : 'Tus datos reales';
  };

  // ---------------------------------------------------------------- estructura
  function shell() {
    const avisos = [S.cliente.email, S.cliente.telegram_chat_id ? 'Telegram' : ''].filter(Boolean).join(' · ');
    const ultimas = S.servicios.map((s) => s.estado?.ultima).filter(Boolean).sort().reverse();
    $('who').textContent = S.cliente.nombre;
    $('app').innerHTML = `
      <div class="p-hero">
        <p class="eyebrow">Tu panel · Denoro Automations</p>
        <h1>${esc(S.cliente.nombre)}</h1>
        <p class="lead">Aquí ves qué hace cada automatización y la ajustas tú. Los cambios se aplican en la siguiente pasada; para verlo al momento, pulsa «Ejecutar ahora».</p>
        <dl class="p-facts">
          <div><dt>Automatizaciones</dt><dd><span class="p-big num">${S.servicios.length}</span></dd></div>
          <div><dt>Última actividad</dt><dd>${esc(ultimas[0] ? ago(ultimas[0]) : 'todavía ninguna')}</dd></div>
          <div><dt>Avisos a</dt><dd>${avisos ? esc(avisos) : '<button type="button" class="p-linkbtn" data-go="avisos">Configúralos aquí</button>'}</dd></div>
        </dl>
      </div>
      <div class="p-tabs-bar"><div class="p-tabs" role="tablist" aria-label="Secciones de tu panel" id="tabs"></div></div>
      <div role="tabpanel" id="panel" tabindex="-1"></div>`;
    renderTabs();
    const bar = document.querySelector('.p-tabs-bar'); const tl = $('tabs');
    const medir = () => { bar.classList.toggle('overflow', tl.scrollWidth > tl.clientWidth + 2); bar.classList.toggle('at-end', tl.scrollLeft + tl.clientWidth >= tl.scrollWidth - 4); };
    tl.addEventListener('scroll', medir, { passive: true }); medirTabs = medir; requestAnimationFrame(medir);
  }
  function renderTabs() {
    const items = [['resumen', 'Resumen', '', '']]
      .concat(S.servicios.map((s) => { const st = estadoAuto(s); return [s.id, AUTO[s.id].corto, st.dot, st.txt]; }),
        [['avisos', 'Avisos', sinAvisos() ? 'bad' : '', sinAvisos() ? 'sin configurar' : '']]);
    $('tabs').innerHTML = items.map(([id, name, dot, estado]) => `<button type="button" class="p-tab" role="tab" id="tab-${id}" aria-controls="panel" aria-selected="${id === tab}" tabindex="${id === tab ? 0 : -1}" data-tab="${id}">` +
      `${dot ? `<span class="p-dot ${dot}" aria-hidden="true"></span>` : ''}${esc(name)}${estado && dot ? `<span class="sr-only"> (${esc(estado)})</span>` : ''}</button>`).join('');
  }
  function orden() { return ['resumen', ...S.servicios.map((s) => s.id), 'avisos']; }
  function nombreDe(id) { return id === 'resumen' ? 'Resumen' : id === 'avisos' ? 'Avisos' : AUTO[id].nombre; }
  function go(id, opts = {}) {
    const valid = orden();
    const nuevo = valid.includes(id) ? id : 'resumen';
    if (dirty && nuevo !== tab && !opts.forzar && !confirm('Tienes cambios sin guardar en esta pestaña. ¿Salir sin guardarlos?')) {
      $(`tab-${tab}`)?.focus(); return;
    }
    dirty = false; tab = nuevo; pending = null;
    if (location.hash.slice(1) !== tab) history.replaceState(null, '', `#${tab}`);
    document.title = `${tab === 'resumen' ? 'Tu panel' : nombreDe(tab)} · ${S.cliente.nombre} · Denoro`;
    renderTabs();
    $(`tab-${tab}`)?.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    const p = $('panel');
    p.setAttribute('aria-labelledby', `tab-${tab}`);
    if (tab === 'resumen') renderResumen(p);
    else if (tab === 'avisos') renderAvisos(p);
    else if (tab === 'monitor') renderMonitor(p);
    else renderAuto(p, tab);
    if (opts.scroll) {
      const bar = document.querySelector('.p-tabs-bar');
      const top = bar.getBoundingClientRect().top + window.scrollY - 68;
      if (window.scrollY > top) window.scrollTo({ top, behavior: 'smooth' });
      $(`tab-${tab}`)?.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
    }
    if (opts.focus) p.focus({ preventScroll: true });
  }
  // Migas y navegación de abajo: «volver al resumen» siempre a mano
  function migas(id) {
    return `<nav class="p-crumbs" aria-label="Estás en"><button type="button" class="p-back" data-go="resumen">${ICON_BACK}Volver al resumen</button>` +
      `<span class="sep" aria-hidden="true">/</span><b aria-current="page">${esc(nombreDe(id))}</b></nav>`;
  }
  function pie(id) {
    const o = orden(); const i = o.indexOf(id); const sig = o[i + 1];
    return `<nav class="p-foot-nav" aria-label="Más secciones"><button type="button" class="p-back" data-go="resumen">${ICON_BACK}Volver al resumen</button>` +
      `${sig ? `<button type="button" class="btn ghost sm" data-go="${sig}">Siguiente: ${esc(nombreDe(sig))} →</button>` : ''}</nav>`;
  }

  // ---------------------------------------------------------------- resumen
  function renderResumen(p) {
    const cards = S.servicios.map((s) => {
      const a = AUTO[s.id]; const st = estadoAuto(s); const aj = s.ajustes || {};
      const linea = s.id === 'monitor'
        ? `${S.vigilancias.length} de ${S.ajustes.max_vigilancias} enlaces vigilados${s.estado?.cambios !== undefined ? ` · ${s.estado.cambios} cambios en la última revisión` : ''}`
        : s.estado?.ok === false ? s.estado.error : (s.estado?.titulo || a.resumen);
      return `<article class="p-auto">
        <p class="eyebrow">${esc(a.cat)}</p>
        <h2>${esc(a.nombre)}</h2>
        <div class="p-state"><span class="badge ${st.cls}">${esc(st.txt)}</span></div>
        <p>${esc(linea)}</p>
        <dl class="p-meta">
          <div><dt>Cuándo</dt><dd>${esc(cadaTxt(a, aj))}</dd></div>
          <div><dt>Última vez</dt><dd>${esc(ago(s.estado?.ultima))}</dd></div>
          ${s.id !== 'monitor' && origenTxt(aj) ? `<div><dt>Datos</dt><dd>${esc(origenTxt(aj))}</dd></div>` : ''}
        </dl>
        <button type="button" class="btn sm" data-go="${a.id}">${s.id === 'monitor' ? 'Ver y añadir enlaces' : 'Abrir y ajustar'} →</button>
      </article>`;
    }).join('');
    p.innerHTML = `${sinAvisos() ? `<p class="msg err" role="alert" style="margin:0 0 var(--s5)">Tus automatizaciones están paradas porque aún no sé dónde avisarte. <button type="button" class="p-linkbtn" data-go="avisos">Pon tu email o tu Telegram</button>.</p>` : ''}
      <div class="p-autos">${cards}</div>`;
  }

  // ---------------------------------------------------------------- campos de un formulario
  const conectada = (need) => !need || (S.conexiones || []).includes(need);
  function campo(auto, f, v) {
    const id = `x-${f.k}`;
    const ay = ayuda(auto, f.k);
    const hint = f.hint ? `<p class="hint" id="${id}-h">${esc(f.hint)}</p>` : '';
    const desc = f.hint ? ` aria-describedby="${id}-h"` : '';
    const wide = ['bool', 'pasos', 'sitios', 'obj', 'lista', 'url'].includes(f.t) || (f.label || '').length > 34 ? ' full' : '';
    const show = f.show ? ` data-show='${esc(JSON.stringify(f.show))}'` : '';
    if (f.t === 'bool') return `<div class="field full"${show}><div class="p-check"><label><input type="checkbox" name="${f.k}" id="${id}"${v ? ' checked' : ''}> <span>${esc(f.label)}${f.hint ? `<small>${esc(f.hint)}</small>` : ''}</span></label>${tip(ay, f.label)}</div></div>`;
    if (f.t === 'select') {
      const opts = f.opts.map(([val, label, x]) => {
        const need = x?.conexion; const inst = !!x?.instalada; const ok = conectada(need) && !inst;
        const nota = inst ? ' (se instala en tu tienda)' : ok ? '' : ' (la conecto yo)';
        return `<option value="${esc(val)}"${val === v ? ' selected' : ''}${ok || val === v ? '' : ' disabled'}>${esc(label)}${nota}</option>`;
      }).join('');
      return `<div class="field${wide}"${show}>${lbl(id, f.label, ay)}<select name="${f.k}" id="${id}"${desc}>${opts}</select>${hint}</div>`;
    }
    if (f.t === 'obj') {
      const val = v || {};
      return `<div class="field full"${show}><div class="p-label"><span class="hint" style="margin:0">${esc(f.hint || '')}</span>${tip(ay, f.label)}</div><div class="p-fgrid" data-obj="${f.k}">${f.campos.map((s) => `
        <div class="field">${lbl(`${id}-${s.k}`, s.label, ayuda('emisor', s.k))}<input id="${id}-${s.k}" data-k="${s.k}" type="${s.t === 'email' ? 'email' : 'text'}" value="${esc(val[s.k] || '')}" maxlength="${s.max || 120}" autocomplete="off"></div>`).join('')}</div></div>`;
    }
    if (f.t === 'pasos') return `<div class="field full"${show} data-list="pasos" data-k="${f.k}"><div class="p-label"><span class="hint" style="margin:0">Hasta cinco avisos, de menos a más horas.</span>${tip(ay, f.label)}</div>${(v || []).map((x, i) => pasoHtml(x, i)).join('')}
      <button type="button" class="btn sm" data-add="paso" style="margin-top:var(--s3)">+ Añadir un aviso</button></div>`;
    if (f.t === 'sitios') return `<div class="field full"${show} data-list="sitios" data-k="${f.k}"><div class="p-label"><span class="hint" style="margin:0">${esc(f.hint || '')}</span>${tip(ay, f.label)}</div>${(v || []).map((x, i) => sitioHtml(x, i)).join('')}
      <button type="button" class="btn sm" data-add="sitio" style="margin-top:var(--s3)">+ Añadir una página</button></div>`;
    const type = { url: 'url', email: 'email', number: 'number', color: 'color' }[f.t] || 'text';
    const val = f.t === 'lista' ? (v || []).join(', ') : v ?? '';
    const extra = f.t === 'number' ? ` inputmode="decimal" step="any"${f.min !== undefined ? ` min="${f.min}"` : ''}${f.max !== undefined ? ` max="${f.max}"` : ''}` : f.max ? ` maxlength="${f.max}"` : '';
    const ph = f.t === 'url' ? ' placeholder="https://" spellcheck="false"' : f.t === 'email' ? ' spellcheck="false"' : '';
    return `<div class="field${wide}"${show}>${lbl(id, f.label, ay)}<input name="${f.k}" id="${id}" type="${type}" value="${esc(val)}"${extra}${ph}${desc} autocomplete="off">${hint}</div>`;
  }
  const pasoHtml = (x, i) => { const b = `paso${i}-${Date.now() % 100000}`; return `<div class="p-sub" data-item>
      <div class="p-sub-head"><b>Aviso ${i + 1}</b><button type="button" class="btn ghost sm danger" data-del>Quitar</button></div>
      <div class="p-fgrid">
        <div class="field">${lbl(`${b}-h`, 'Horas desde el abandono', ayuda('carritos', 'horas'))}<input id="${b}-h" data-k="horas" type="number" min="0" max="2000" step="any" inputmode="decimal" value="${esc(x.horas ?? '')}"></div>
        <div class="field">${lbl(`${b}-c`, 'Cupón (opcional)', ayuda('carritos', 'cupon'))}<input id="${b}-c" data-k="cupon" value="${esc(x.cupon || '')}" maxlength="30" autocomplete="off" spellcheck="false"></div>
        <div class="field full">${lbl(`${b}-a`, 'Asunto del email', ayuda('carritos', 'asunto'))}<input id="${b}-a" data-k="asunto" value="${esc(x.asunto || '')}" maxlength="120"></div>
      </div></div>`; };
  const sitioHtml = (x, i) => { const b = `sitio${i}-${Date.now() % 100000}`; return `<div class="p-sub" data-item>

  function leerForm(form, a) {
    const out = {};

      if (!f.k) continue;
      if (f.t === 'obj') { out[f.k] = Object.fromEntries([...form.querySelectorAll(`[data-obj="${f.k}"] [data-k]`)].map((i) => [i.dataset.k, i.value])); continue; }
      if (f.t === 'pasos' || f.t === 'sitios') { out[f.k] = [...form.querySelectorAll(`[data-list][data-k="${f.k}"] [data-item]`)].map((it) => Object.fromEntries([...it.querySelectorAll('[data-k]')].map((i) => [i.dataset.k, i.value]))); continue; }
      const el = form.elements[f.k]; if (!el) continue;
      out[f.k] = f.t === 'bool' ? el.checked : el.value;
    }
    if (form.elements.cada_horas) out.cada_horas = Number(form.elements.cada_horas.value);
    if (form.elements.programado) out.programado = form.elements.programado.checked;

  function aplicarVisibilidad(form) {
    const vals = Object.fromEntries([...form.querySelectorAll('select[name]')].map((s) => [s.name, s.value]));

      const cond = JSON.parse(el.dataset.show);
      el.hidden = !Object.entries(cond).every(([k, vs]) => vs.includes(vals[k]));
    });
    const demo = [vals.fuente, vals.destino].filter(Boolean);
    const aviso = form.querySelector('[data-demo]');
    if (aviso) aviso.hidden = !demo.includes('demo');
  }

    const label = [...form.querySelectorAll('label')].find((l) => l.textContent.trim() === m[1] && l.htmlFor);

    if (input && !input.closest('[hidden]')) { input.setAttribute('aria-invalid', 'true'); input.focus({ preventScroll: false }); }
  }

      <form class="p-card" id="setForm" novalidate>
        <p class="eyebrow">Avisos</p>
        <h2>Dónde te llegan los resultados</h2>
        <p>Todas tus automatizaciones te escriben aquí: un mensaje cuando hay algo que contar, nunca spam. Hace falta al menos uno de los dos.</p>
        <fieldset style="margin-top:var(--s5)"><div class="p-fgrid">
          <div class="field full">${lbl('email', 'Email', ayuda('avisos', 'email'))}<input id="email" type="email" value="${esc(S.cliente.email)}" placeholder="tu@tienda.com" autocomplete="email" spellcheck="false"></div>
          <div class="field full">${lbl('chat', 'Telegram · chat ID (opcional)', ayuda('avisos', 'chat'))}<input id="chat" inputmode="numeric" value="${esc(S.cliente.telegram_chat_id)}" placeholder="123456789" autocomplete="off">
            <ol class="p-kinds"><li>Abre ${bot ? `<a href="${esc(bot)}" target="_blank" rel="noopener">el bot de avisos de Denoro</a>` : 'el bot de avisos de Denoro'} y pulsa <b>Iniciar</b>.</li><li>Escribe a <a href="https://t.me/userinfobot" target="_blank" rel="noopener">@userinfobot</a> y copia el número que te da como <b>Id</b>.</li></ol></div>
        </div></fieldset>
        <div class="p-actions"><button class="btn primary" id="saveSet">Guardar</button><button type="button" class="btn" id="testBtn">Enviarme una prueba</button></div>
        <div id="setMsg" aria-live="polite"></div>
      </form>
      <aside class="p-side"><div class="p-card sunk">
        <p class="eyebrow">Tus automatizaciones</p>
        <ul class="p-chips" style="margin-top:var(--s2)">${S.servicios.map((s) => `<li>${esc(AUTO[s.id].nombre)}</li>`).join('')}</ul>
        <p class="p-note">¿Quieres añadir otra o cambiar de plan? <a href="https://denoroautomations.com/automatizaciones.html" target="_blank" rel="noopener">Mira el catálogo</a> y escríbeme.</p>
      </div></aside>
    </div>${pie('avisos')}`;
    const f = $('setForm');
    f.addEventListener('input', () => { dirty = true; });
    f.addEventListener('submit', async (ev) => {
      ev.preventDefault(); msg('setMsg', '');
      await busy($('saveSet'), 'Guardando', async () => {
        const r = await api('ajustes', { email: $('email').value.trim(), telegram_chat_id: $('chat').value.trim() });
        if (!r.ok) { msg('setMsg', r.error); (/email/i.test(r.error) ? $('email') : $('chat')).setAttribute('aria-invalid', 'true'); return; }
        dirty = false; toast('Avisos guardados'); await load(true); msg('setMsg', 'Guardado', 'ok');
      });
    });
    $('testBtn').addEventListener('click', async (ev) => {
      msg('setMsg', '');
      if (dirty) return msg('setMsg', 'Guarda primero los cambios para que la prueba vaya a la dirección nueva.', 'warn');
      await busy(ev.currentTarget, 'Enviando', async () => {
        const r = await api('probar_aviso');
        msg('setMsg', r.ok ? r.mensaje : r.error, r.ok ? 'ok' : 'err');
      });
    });
  }

  // ---------------------------------------------------------------- carga
  async function load(keep) {
    const r = await api('estado');
    if (!r.ok) { if (!keep || !S) $('app').innerHTML = `<div class="p-center"><div><p class="eyebrow">Denoro Automations</p><h1>No se puede abrir tu panel</h1><p class="lead">${esc(r.error)}</p></div></div>`; else toast(r.error); return; }
    const first = !S; S = r;
    if (first || !keep) { shell(); go(location.hash.slice(1) || 'resumen', { forzar: true }); return; }
    const y = window.scrollY; shell(); go(tab, { forzar: true }); window.scrollTo(0, y);
  }
  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-tab]'); if (t) { go(t.dataset.tab, { scroll: true }); return; }
    const g = e.target.closest('[data-go]'); if (g) { e.preventDefault(); go(g.dataset.go, { scroll: true, focus: true }); }
  });
  document.addEventListener('keydown', (e) => {
    if (!e.target.matches?.('.p-tab')) return;
    const tabs = [...document.querySelectorAll('.p-tab')]; const i = tabs.indexOf(e.target);
    const k = { ArrowRight: i + 1, ArrowLeft: i - 1, Home: 0, End: tabs.length - 1 }[e.key];
    if (k === undefined) return;
    e.preventDefault();
    const n = tabs[(k + tabs.length) % tabs.length]; go(n.dataset.tab); $(`tab-${tab}`)?.focus();
  });
  window.addEventListener('hashchange', () => { if (S && location.hash.slice(1) !== tab) go(location.hash.slice(1)); });
  window.addEventListener('beforeunload', (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
  // El estado «ejecutándose» se refresca solo mientras dure
  setInterval(() => { if (S && !dirty && document.visibilityState === 'visible' && S.servicios.some((s) => enCurso(s.estado))) load(true); }, 15000);

  if (!token) $('app').innerHTML = '<div class="p-center"><div><p class="eyebrow">Denoro Automations</p><h1>Falta tu enlace de acceso</h1><p class="lead">Abre el enlace personal que te envié desde Denoro.</p></div></div>';
  else load();
})();
</script>
</body>
</html>
